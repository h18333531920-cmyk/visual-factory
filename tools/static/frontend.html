        }
    }
    var diySubtagFilter = '全部';
    var diySelectedSubtag = '全部'; // 真正选中的分类，影响保存时的 tag2
    var DIY_SUBTAGS = {
        layout: ['全部', '社媒物料', 'C端物料'],
        component: ['全部', '标签', '背景', '品牌圆弧', 'LOGO', 'KIKI', '其他素材', '组合']
    };
    function getColorPaletteCards() {
        if(!cloudColorPaletteSnapshot.loaded) return [];
        const tagCards = cloudColorPaletteSnapshot.tagColorPresets.filter(function(preset) { return preset?._cloudSaved === true; }).map(function(preset) {
            return { id: 'tag-color-' + preset.id, type: '标签配色', name: preset.name || '标签配色', colors: [preset.bg, preset.text, preset.shadow].filter(Boolean) };
        });
        const arcCards = cloudColorPaletteSnapshot.arcColorPresets.filter(function(preset) { return preset?._cloudSaved === true; }).map(function(preset) {
            return { id: 'arc-color-' + preset.id, type: '圆环配色', name: preset.name || '圆环配色', colors: [preset.cIn, preset.cOut].filter(Boolean) };
        });
        return tagCards.concat(arcCards);
    }
    function renderDiySubtags() {
        var row = document.getElementById('diy-subtag-row');
        if (!row) return;
        var tags = DIY_SUBTAGS[currentAssetTab] || [];
        if (tags.length <= 1) { row.innerHTML = ''; return; }
        // 计算每个二级标签下的项目数量
        var counts = {};
        tags.forEach(function(t) { counts[t] = 0; });
        if (currentAssetTab === 'layout') {
            presetLibrary.forEach(function(p) {
                tags.forEach(function(t) {
                    if (t === '全部') { counts[t]++; return; }
                    if ((p.name || '').indexOf(t) !== -1) counts[t]++;
                });
            });
        } else if (currentAssetTab === 'component') {
            tagPresetLibrary.concat(logoAssets).concat(groupPresets).forEach(function(item) {
                var itemTag = item.subTag || item._subTag || '';
                if (!itemTag && item.tags && Array.isArray(item.tags)) {
                    var tt = item.tags;
                    if (tt.includes('标签')) itemTag = '标签';
                    else if (tt.includes('背景')) itemTag = '背景';
                    else if (tt.includes('品牌圆弧')) itemTag = '品牌圆弧';
                    else if (tt.includes('LOGO')) itemTag = 'LOGO';
                    else if (tt.includes('KIKI')) itemTag = 'KIKI';
                    else if (tt.includes('字体')) itemTag = '字体';
                    else if (tt.includes('组合')) itemTag = '组合';
                    else if (tt.includes('其他素材')) itemTag = '其他素材';
                }
                counts['全部']++;
                if (counts[itemTag] !== undefined) counts[itemTag]++;
            });
        }
        row.innerHTML = tags.map(function(t) {
            var isFilterActive = diySubtagFilter === t;
            var isSelected = diySelectedSubtag === t;
            var style = 'font-size:11px;padding:2px 10px;';
            if (isSelected && t !== '全部') style += 'background:#0d9488;color:#fff;border-color:#0d9488;';
            var cnt = counts[t] || 0;
            var label = t + ' · ' + cnt;
            return '<button class="filter-capsule' + (isFilterActive || isSelected ? ' active' : '') + '" onclick="diySubtagFilter=\'' + t + '\';diySelectedSubtag=\'' + t + '\';renderAssetLibrary();" style="' + style + '">' + label + '</button>';
        }).join('');
    }

    function refreshAssetLibrary() {
        var btn = document.getElementById('refresh-asset-btn');
        if (btn) { btn.style.transform = 'rotate(360deg)'; btn.style.transition = 'transform 0.6s ease'; setTimeout(function() { btn.style.transform = ''; btn.style.transition = ''; }, 600); }
        notifyParent({ type: 'vf:request-templates' });
    }
    function renderAssetLibrary() {
        var cl = document.getElementById('diy-count-layout'); if (cl) cl.textContent = '· ' + presetLibrary.length;
        var cc = document.getElementById('diy-count-component'); if (cc) cc.textContent = '· ' + (tagPresetLibrary.length + logoAssets.length + groupPresets.length);
        var cr = document.getElementById('diy-count-recycle'); if (cr) cr.textContent = '· ' + recycleBin.length;
        renderDiySubtags();
        const list = document.getElementById('asset-list-ui'); if(!list) return;
        list.innerHTML = '';
        // 使用真实的两列容器来实现瀑布流。CSS multi-column 在此滚动区域会把后续项排到
        // 看不见的横向列里，导致“背景 · 41”却只能看到少量卡片。
        var masonryColumns = [];
        var masonryOrder = 0;
        var masonryFrame = 0;
        function appendAssetItem(item) {
            if (!masonryColumns.length) { list.appendChild(item); return; }
            item.dataset.masonryOrder = String(masonryOrder++);
            var target = masonryColumns[0].scrollHeight <= masonryColumns[1].scrollHeight ? masonryColumns[0] : masonryColumns[1];
            target.appendChild(item);
            item.querySelectorAll('img').forEach(function(image) {
                if (!image.complete) image.addEventListener('load', rebalanceMasonry, { once: true });
            });
        }
        function rebalanceMasonry() {
            if (masonryFrame || !masonryColumns.length) return;
            masonryFrame = requestAnimationFrame(function() {
                masonryFrame = 0;
                var allItems = Array.from(masonryColumns[0].children).concat(Array.from(masonryColumns[1].children))
                    .sort(function(a, b) { return Number(a.dataset.masonryOrder) - Number(b.dataset.masonryOrder); });
                masonryColumns[0].replaceChildren();
                masonryColumns[1].replaceChildren();
                allItems.forEach(function(item) {

                    if (e.data.dataUrl) resolve(e.data.dataUrl);

    function getLayerBounds(l) {
        const scale = Number(l.scale) || 1;
        if(l.type === 'image' || l.type === 'logo' || l.type === 'solid') {
            const w = (Number(l.baseW) || 260) * scale;
            const h = (Number(l.baseH) || 160) * scale;
            return { x1: l.x - w / 2, y1: l.y - h / 2, x2: l.x + w / 2, y2: l.y + h / 2, w, h, cx: l.x, cy: l.y, area: w * h };
        }
        if(l.type === 'tag') {
            const textLen = Math.max(4, String(l.text || '').length);
            const w = (textLen * 28 + 116) * scale;
            const h = 78 * scale;
            return { x1: l.x - w / 2, y1: l.y - h / 2, x2: l.x + w / 2, y2: l.y + h / 2, w, h, cx: l.x, cy: l.y, area: w * h };
        }
        if(l.type === 'text') {
            const lines = String(l.text || '').split('\n');
            const fontSize = Number(l.fontSize) || 88;
            const lineHeight = Number(l.lineHeight) || 0.95;
            const letterSpacing = Number(l.letterSpacing) || 0;
            const maxLineChars = Math.max(1, ...lines.map(line => line.length));
            const rawW = maxLineChars * (fontSize * 0.64 + letterSpacing);
            const w = Math.min(Number(l.maxWidth) || 620, Math.max(fontSize, rawW)) * scale;
            const h = Math.max(fontSize, lines.length * fontSize * lineHeight) * scale;
            return { x1: l.x - w / 2, y1: l.y - h / 2, x2: l.x + w / 2, y2: l.y + h / 2, w, h, cx: l.x, cy: l.y, area: w * h };
        }
        if(l.type === 'discountTag') {
            normalizeDiscountTagLayer(l);
            const mainLen = Math.max(1, String(l.mainText || '').length);
            const sideLen = Math.max(String(l.topText || '').length, String(l.bottomText || '').length, 1);
            const sideSize = Math.max(Number(l.topFontSize) || Number(l.sideFontSize) || 52, Number(l.bottomFontSize) || Number(l.sideFontSize) || 42);
            const w = (mainLen * (Number(l.mainFontSize) || 96) * 0.64 + sideLen * sideSize * 0.72 + (Number(l.sideGap) || 8) + (Number(l.tagPaddingX) || 34) * 2) * scale;
            const h = ((Number(l.mainFontSize) || 96) * 0.92 + (Number(l.tagPaddingY) || 15) * 2 + (Number(l.shadowThickness) || 0)) * scale;
            return { x1: l.x - w / 2, y1: l.y - h / 2, x2: l.x + w / 2, y2: l.y + h / 2, w, h, cx: l.x, cy: l.y, area: w * h };
        }
        if(l.type === 'arc') {
            const rIn = Number(l.rIn) || 400;
            const wIn = Number(l.wIn) || 40;
            const wOut = Number(l.wOut) || 120;
            const size = (rIn + wIn + wOut) * 2 * scale;
            return { x1: l.x - size / 2, y1: l.y - size / 2, x2: l.x + size / 2, y2: l.y + size / 2, w: size, h: size, cx: l.x, cy: l.y, area: size * size };
        }
        return { x1: l.x, y1: l.y, x2: l.x, y2: l.y, w: 0, h: 0, cx: l.x, cy: l.y, area: 0 };
    }
    function getGroupBounds(group) {
        if(group.length === 0) return null;
        const boxes = group.map(getLayerBounds);
        const x1 = Math.min(...boxes.map(b => b.x1));
        const y1 = Math.min(...boxes.map(b => b.y1));
        const x2 = Math.max(...boxes.map(b => b.x2));
        const y2 = Math.max(...boxes.map(b => b.y2));
        return { x1, y1, x2, y2, w: x2 - x1, h: y2 - y1, cx: (x1 + x2) / 2, cy: (y1 + y2) / 2 };
    }
    function clampLayerToSafeArea(l, target, safe) {
        if(l.type === 'arc') return l;
        const b = getLayerBounds(l);
        const minX = safe + b.w / 2;
        const maxX = target.w - safe - b.w / 2;
        const minY = safe + b.h / 2;
        const maxY = target.h - safe - b.h / 2;
        if(maxX >= minX) l.x = Math.min(maxX, Math.max(minX, l.x));
        if(maxY >= minY) l.y = Math.min(maxY, Math.max(minY, l.y));

    }
    function classifyHeadLayers(sourceLayers, sourceSize) {
        const canvasArea = sourceSize.w * sourceSize.h;
        const images = sourceLayers.filter(l => l.type === 'image');
        const imageCandidates = images
            .map(l => ({ layer: l, bounds: getLayerBounds(l) }))
            .sort((a, b) => b.bounds.area - a.bounds.area);
        const background = imageCandidates.find(item => item.bounds.area >= canvasArea * 0.55)?.layer
            || [...images].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0))[0]
            || null;
        const infoIds = new Set(sourceLayers.filter(l => ['tag', 'discountTag'].includes(l.type)).map(l => l.id));
        const bgId = background?.id;
        const visualIds = new Set(sourceLayers
            .filter(l => (l.type === 'image' || l.type === 'logo') && l.id !== bgId)
            .map(l => l.id));
        return { bgId, infoIds, visualIds, infoBounds: getGroupBounds(sourceLayers.filter(l => infoIds.has(l.id))) };

    function transformLayerForArtboard(layer, sourceSize, targetPreset, meta) {
        const target = SIZES[targetPreset.ratio];
        const safe = targetPreset.id === 'banner' ? 64 : 54;
        const l = cloneData(layer);
        l.id = genId(l.type);
        l.locked = false;
        const srcXRatio = (Number(layer.x) || sourceSize.w / 2) / sourceSize.w;
        const srcYRatio = (Number(layer.y) || sourceSize.h / 2) / sourceSize.h;

        if(layer.id === meta.bgId) {
            l.role = 'extended-background';
            l.sourceLayerId = layer.id;
            if(targetPreset.id === 'splash') {
                l.x = target.w * 0.06;
                l.y = target.h * 0.45;
                l.baseW = sourceSize.w;
                l.baseH = sourceSize.h;
                l.scale = 2.18;
                l.zIndex = (Number(layer.zIndex) || 1) + 1;
                return l;
            }
            if(targetPreset.id === 'banner') {
                l.x = target.w * 0.76;
                l.y = target.h * 0.50;
                l.baseW = target.w * 0.54;
                l.baseH = target.h;
                l.scale = 1;
                l.zIndex = (Number(layer.zIndex) || 1) + 1;
                return l;
            }
            const cover = Math.max(target.w / sourceSize.w, target.h / sourceSize.h);
            l.x = target.w / 2;
            l.y = target.h / 2;
            l.scale = (Number(layer.scale) || 1) * cover;
            return l;
        }

        if(meta.infoIds.has(layer.id)) {
            const group = meta.infoBounds || { cx: sourceSize.w * 0.35, cy: sourceSize.h * 0.32, w: sourceSize.w * 0.45, h: sourceSize.h * 0.24 };
            const factor = targetPreset.id === 'banner' ? 1.05 : 1.42;
            const targetCx = targetPreset.id === 'banner' ? target.w * 0.26 : target.w * 0.47;
            const targetCy = targetPreset.id === 'banner' ? target.h * 0.42 : target.h * 0.19;
            l.x = targetCx + ((Number(layer.x) || group.cx) - group.cx) * factor;
            l.y = targetCy + ((Number(layer.y) || group.cy) - group.cy) * factor;
            l.scale = (Number(layer.scale) || 1) * factor;
            return clampLayerToSafeArea(l, target, safe);
        }

        if(meta.visualIds.has(layer.id)) {
            const factor = targetPreset.id === 'banner'
                ? Math.min(1.08, target.h / sourceSize.h * 1.02)
                : Math.min(1.28, target.w / sourceSize.w * 1.08);
            l.x = targetPreset.id === 'banner'
                ? target.w * 0.76 + (srcXRatio - 0.68) * target.w * 0.22
                : target.w * 0.55 + (srcXRatio - 0.62) * target.w * 0.26;
            l.y = targetPreset.id === 'banner'

                : target.h * 0.61 + (srcYRatio - 0.58) * target.w * 0.46;
            l.scale = (Number(layer.scale) || 1) * factor;
            return clampLayerToSafeArea(l, target, safe);
        }

        if(layer.type === 'arc') {
            if(targetPreset.id === 'splash') {
                l.x = target.w * 0.50;
                l.y = target.h + 120;
                l.scale = (Number(layer.scale) || 1) * 1.05;
                return l;
            }
            if(targetPreset.id === 'banner') {
                l.x = target.w * 0.82;
                l.y = target.h * 1.05;
                l.scale = (Number(layer.scale) || 1) * 0.74;
                return l;
            }
            const factor = targetPreset.id === 'banner' ? target.h / sourceSize.h : target.w / sourceSize.w;
            l.x = srcXRatio * target.w;
            l.y = srcYRatio > 0.55 ? target.h - (sourceSize.h - layer.y) * factor : srcYRatio * target.h;
            l.scale = (Number(layer.scale) || 1) * factor;
            return l;
        }

        const fallback = targetPreset.id === 'banner' ? target.h / sourceSize.h : target.w / sourceSize.w;
        l.x = srcXRatio * target.w;
        l.y = srcYRatio * target.h;
        l.scale = (Number(layer.scale) || 1) * fallback;
        return clampLayerToSafeArea(l, target, safe);
    }
    function buildExtendedArtboard(targetId, sourceLayers) {
        const sourceSize = SIZES.head;
        const preset = getArtboardPreset(targetId);
        const meta = classifyHeadLayers(sourceLayers, sourceSize);
        const minZ = sourceLayers.length > 0 ? Math.min(...sourceLayers.map(l => Number(l.zIndex) || 1)) : 1;
        const arcLayer = sourceLayers.find(l => l.type === 'arc');
        const brandGreen = arcLayer?.cOut || '#00875f';
        const underlays = [];
        if(targetId === 'splash' || targetId === 'banner') {
            const target = SIZES[preset.ratio];
            underlays.push({
                id: genId('solid'),
                type: 'solid',
                sharedKey: 'shared_brand_background',
                color: brandGreen,
                x: target.w / 2,
                y: target.h / 2,
                baseW: target.w,
                baseH: target.h,
                scale: 1,
                rotation: 0,
                zIndex: minZ - 8,
                locked: true

        }
        return [
            ...underlays,
            ...sourceLayers
            .map(layer => transformLayerForArtboard(layer, sourceSize, preset, meta))

            const sourceLayers = getSortedLayersByType(headLayers, type);

    function ensureTemplateBackgroundLayer(boardLayers, targetId, sourceLayer) {
        const preset = getArtboardPreset(targetId);

            if(data.arcColorPresets) arcColorPresets = data.arcColorPresets;
            if(data.keywordTags) keywordTags = data.keywordTags;
            if(data.referenceElements) referenceElements = data.referenceElements;

            const fonts = Array.isArray(backup.fonts) ? backup.fonts : [];
            await replaceStoreInDB('fonts', fonts);
            await replaceStoreInDB('referenceElements', referenceElements);

            customFonts = [];

    async function addFontFiles(inputFiles) {
        const files = Array.from(inputFiles || []).filter(file => /\.(ttf|otf|woff2?)$/i.test(file.name || ''));
        if(!files.length) { showToast('请选择 TTF、OTF、WOFF 或 WOFF2 字体文件', true); return; }
        let installedCount = 0, syncedExistingCount = 0, skippedCount = 0, failedCount = 0;
        const failures = [];
        for(const file of files) {
            const name = file.name.replace(/\.[^/.]+$/, '');
            const existingFont = customFonts.find(function(font) { return font.name === name; });
            if(existingFont) {
                // 早期版本只把字体装入 IndexedDB，资产库被移除后这些字体没有云端记录。
                // 重新选择同一文件时应补传已有的原始数据，不能再直接当作“重复”跳过。
                const normalizedExisting = normalizeCustomFontAsset(existingFont);
                if (queueFontForCloud(normalizedExisting, file.name, name)) syncedExistingCount++;
                else skippedCount++;
                continue;
            }
            try {
                const dataUrl = await readFontFile(file);
                const fontData = normalizeCustomFontAsset({ name, data: dataUrl, fileName: file.name });
                if(!await registerFontAsset(fontData)) throw new Error('字体解析失败');
                await saveFontToDB(fontData);
                installedCount++;
                queueFontForCloud(fontData, file.name, name);
            } catch(error) {
                failedCount++;
                failures.push((file.name || '字体文件') + '：' + (error?.message || '解析失败'));
            }
        }
        if(installedCount || syncedExistingCount) {
            queueSharedAssetSave();
            renderCanvas(); renderProperties(); renderSettings(); saveHistory();
        }
        const results = [installedCount ? `已安装 ${installedCount} 个` : '', syncedExistingCount ? `正在补传 ${syncedExistingCount} 个本地字体` : '', skippedCount ? `跳过 ${skippedCount} 个已同步文件` : '', failedCount ? `${failedCount} 个解析失败` : ''].filter(Boolean).join('，');
        showToast(results || '没有可安装的字体', failedCount > 0 && !installedCount);
        if (failedCount && failures.length) console.warn('字体上传失败：', failures.join('；'));
        return { installedCount, syncedExistingCount, skippedCount, failedCount, failures };
    }
    function queueFontForCloud(font, fileName, fallbackName) {
        const normalized = normalizeCustomFontAsset(font || {});
        if (!normalized.data) return false;
        const sameFont = fontAssets.some(function(asset) {
            return asset.fontFamilyId === normalized.familyId && Number(asset.fontWeight || 400) === Number(normalized.weight || 400)
                && (asset.cloudId || asset._pending);
        });
        if (sameFont) return false;
        const fontTempId = genId('font_asset');
        fontAssets.push({
            id: fontTempId, name: normalized.familyName || fallbackName, fontFamilyName: normalized.familyName,
            fontFamilyId: normalized.familyId, fontWeight: normalized.weight, fontWeightLabel: normalized.weightLabel,
            fontFileName: fileName || normalized.fileName || (fallbackName + '.ttf'), fontData: normalized.data,
            _installed: true, _pending: true, subTag: '字体'
        });
        notifyParent({
            type: 'vf:save-font', templateType: 'font', name: fallbackName || normalized.name,
            familyName: normalized.familyName, familyId: normalized.familyId,
            weight: normalized.weight, weightLabel: normalized.weightLabel,
            fileName: fileName || normalized.fileName || (fallbackName + '.ttf'), data: normalized.data,
            subTag: '字体', previewDataUrl: generateFontAssetPreview(fallbackName || normalized.name, normalized.familyName, normalized.weight),
            tempId: fontTempId
        });
        return true;
    }

    function isStaticPreviewRuntime() {
        const host = String(location.hostname || '').toLowerCase();
        return host.endsWith('.github.io');
    }

    function requireAIBackendRuntime() {
        if(!isStaticPreviewRuntime()) return;
        throw new Error('当前是 GitHub 静态预览页，不能使用生图、扩图或提示词优化。请改用 Cloudflare Pages 测试版或正式站。');
    }

    async function readAIResponse(response, actionLabel) {
        const contentType = String(response.headers.get('content-type') || '').toLowerCase();
        if(!contentType.includes('application/json')) {
            if(isStaticPreviewRuntime()) {
                throw new Error('当前是 GitHub 静态预览页，不能使用生图、扩图或提示词优化。请改用 Cloudflare Pages 测试版或正式站。');
            }
            throw new Error(`${actionLabel}接口返回异常（HTTP ${response.status}），请稍后重试。`);

    async function renderCurrentArtboardBlob(scale = 3) {
        const wrap = document.getElementById('canvas-wrapper');
        const safeGuide = document.getElementById('safe-guide');
        const oldGuideDisplay = safeGuide ? safeGuide.style.display : '';
        if(safeGuide) safeGuide.style.display = 'none';
        // 导出使用画板的离屏副本，不能直接修改正在编辑的画板尺寸/定位，
        // 否则会产生画板闪烁，也可能使 html2canvas 在重排期间截图失败。
        const clone = wrap.cloneNode(true);
        const preset = getArtboardPreset(currentArtboardId);
        // 与导出菜单保持同一尺寸来源，不能回退到 head（750×500）等固定画板尺寸。
        const currentSize = SIZES[currentRatio] || preset;
        const width = Number(currentSize.w) || Number(preset.w) || 1080;
        const height = Number(currentSize.h) || Number(preset.h) || 1080;
        // 自动压低倍率：确保输出的总像素数在浏览器安全范围内
        const safeScale = Math.min(scale, Math.sqrt(SAFE_CANVAS_PX / (width * height)));
        clone.style.cssText = `position:fixed;left:-99999px;top:0;width:${width}px;height:${height}px;transform:none;z-index:-1;overflow:hidden;background:#FFFFFF;pointer-events:none;`;
        document.body.appendChild(clone);

            const usesHTHeliopolis = hasHTHeliopolisTextLayer();
            // 主路径：直接用 OpenType 的 glyph outline 合成文本，不能让 html2canvas
            // 重新排版 HT。只有取不到原生 Range 坐标时，才尝试 SVG 文字图片后备。
            // 已验证 Fontkit/SVG 的本地 OTF 路径在当前浏览器导出环境会生成空白图。
            // 不允许未验证的转换链路继续隐藏原文字：导出先稳定回退为浏览器文字。
            let nativeTextJobs = [];
            let nativeTextVector = null;
            // SVG foreignObject 在部分浏览器无法嵌入本地上传的 OTF，失败时会生成空白
            // 图片。它不能作为导出后备：路径不可用时保留 html2canvas 的原始文字，
            // 绝不能把所有文字替换成空白图层。
            const nativeTextRasterized = false;
            const htExportMode = !usesHTHeliopolis ? 'standard'
                : nativeTextVector ? 'outline'
                : nativeTextRasterized ? 'native-image'
                : 'legacy-fallback';
            // 专用坐标采集只是高保真增强，绝不能成为 PNG 导出的单点失败条件。
            // 个别模板把 HT 用在标签等复合组件中，不会产生普通文本图层坐标；
            // 此时回退到原有的离屏冻结排版，而不是中止整个导出。
            if (usesHTHeliopolis && !nativeTextRasterized && !nativeTextJobs.length) {
                console.warn('未读取到 HT 普通文本坐标，使用离屏排版冻结导出');
                preserveExportTextSpacingForCapture(clone);
            } else if (!usesHTHeliopolis) {
                preserveExportTextSpacingForCapture(clone);
            }
            await waitForImagesIn(clone);
            await new Promise(r => setTimeout(r, 300));
            // 允许被跨域图片污染的 canvas 会在 toBlob 时被浏览器拒绝读取，最终导致导出失败。
            // useCORS 会优先加载可安全导出的远程图片；不支持 CORS 的资源不会破坏整张导出图。
            const canvas = await html2canvas(clone, { scale: safeScale, width, height, useCORS: true, allowTaint: false, backgroundColor: '#FFFFFF', logging: false, imageTimeout: 0 });
            if (nativeTextVector) {
                const context = canvas.getContext('2d');
                context.drawImage(nativeTextVector.image, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(nativeTextVector.url);
            }
            const blob = await new Promise((resolve, reject) => canvas.toBlob(result => result ? resolve(result) : reject(new Error('无法生成 PNG 文件')), 'image/png'));
            // 诊断字段不影响 Blob 下载；用于明确告诉用户本次到底走了哪条 HT 路径。
            blob.vfHTExportMode = htExportMode;
            return blob;
        } finally {
            clone.remove();
            if(safeGuide) safeGuide.style.display = oldGuideDisplay;
            syncSafeGuide();
        }
    }
    function getCustomFontAssetsForCss(fontFamily, preferredWeight) {
        const family = String(fontFamily || '').replace(/["']/g, '');
        const weight = Number(preferredWeight) || 400;
        return customFonts.map(normalizeCustomFontAsset).filter(function(font) {
            // 页面最终 CSS 往往是生成的 CF_* familyId，而模板数据可能仍是字体名称；
            // 两种情况都必须识别，不能再从文件名是否包含 HT 推断。
            return !!font.data && (family.indexOf(font.familyId) !== -1 || family.indexOf(font.familyName) !== -1);
        }).sort(function(a, b) {
            return Math.abs(Number(a.weight || 400) - weight) - Math.abs(Number(b.weight || 400) - weight);
        });
    }
    function hasHTHeliopolisTextLayer() {
        // 函数名保留以兼容现有调用；实际语义是“当前文字是否使用可转换路径的自定义字体”。
        const renderedWithCustomFont = Array.from(document.querySelectorAll('#canvas-wrapper .layer-text-wrapper')).some(function(node) {
            try {
                const style = getComputedStyle(node);
                return getCustomFontAssetsForCss(style.fontFamily, style.fontWeight).length > 0;
            } catch (_error) { return false; }
        });
        if (renderedWithCustomFont) return true;
        return layers.some(function(layer) {
            return layer?.type === 'text' && getCustomFontAssetsForCss(layer.font, layer.fontWeight).length > 0;
        });
    }

                range.setEnd(node, match.index + match[0].length);
                const rect = range.getBoundingClientRect();
                if (rect.width || rect.height) tokens.push({ text: match[0], left: rect.left - contentRect.left, top: rect.top - contentRect.top });
            }
        });
        if (!tokens.length) return;
        content.replaceChildren();
        content.style.position = 'relative';
        content.style.display = 'block';
        content.style.width = width + 'px';
        content.style.height = height + 'px';
        content.style.whiteSpace = 'normal';
        tokens.forEach(function(token) {
            const item = document.createElement('span');
            item.textContent = token.text;
            item.style.cssText = 'position:absolute;display:block;left:' + token.left + 'px;top:' + token.top + 'px;white-space:pre;font:inherit;line-height:inherit;letter-spacing:inherit;word-spacing:normal;color:inherit;direction:inherit;unicode-bidi:inherit;';
            content.appendChild(item);
        });
    }
    function preserveHTTextSpacingForExport(content, wrapper, isRtl) {
        const spaceWidth = measureNativeExportSpaceWidth(wrapper);
        const textNodes = [];
        const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        textNodes.forEach(function(textNode) {
            const value = textNode.nodeValue || '';
            if (!/[\t ?\uFF1F\u061F]/.test(value)) return;
            const fragment = document.createDocumentFragment();
            value.split(/([ \t]+|[?\uFF1F\u061F])/).forEach(function(part) {
                if (!part) return;
                if (/^[ \t]+$/.test(part)) {
                    const gap = document.createElement('span');
                    gap.setAttribute('aria-hidden', 'true');
                    gap.style.cssText = 'display:inline-block;width:' + (spaceWidth * part.length) + 'px;height:1px;vertical-align:baseline;';
                    fragment.appendChild(gap);
                } else if (/^[?\uFF1F\u061F]$/.test(part)) {
                    const mark = document.createElement('span');
                    mark.textContent = part;
                    const punctuationGap = Math.max(2, spaceWidth * 0.3);
                    mark.style.cssText = 'display:inline-block;letter-spacing:0!important;' + (isRtl ? 'margin-right:' : 'margin-left:') + punctuationGap + 'px;';
                    fragment.appendChild(mark);
                } else {
                    fragment.appendChild(document.createTextNode(part));
                }
            });
            textNode.parentNode.replaceChild(fragment, textNode);
        });
    }
    function measureNativeExportSpaceWidth(wrapper) {
        const style = getComputedStyle(wrapper);
        const probe = document.createElement('span');
        probe.style.cssText = 'position:fixed;left:-99999px;top:0;visibility:hidden;white-space:pre;font-family:' + style.fontFamily + ';font-size:' + style.fontSize + ';font-weight:' + style.fontWeight + ';font-style:' + style.fontStyle + ';letter-spacing:0;word-spacing:normal;line-height:1;';
        document.body.appendChild(probe);
        probe.textContent = 'AA';
        const compactWidth = probe.getBoundingClientRect().width;
        probe.textContent = 'A A';
        const spacedWidth = probe.getBoundingClientRect().width;
        probe.remove();
        return Math.max(1, spacedWidth - compactWidth);
    }
    function downloadBlob(blob, filename) {
        if(!blob) throw new Error('empty blob');
        const link = document.createElement('a');
        link.download = filename;
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
    }
    async function exportPNG(scale) {
        scale = scale || 3;
        if(layers.length === 0) return showToast('画板为空，无法导出', true);
        const requiresNativeCapture = hasHTHeliopolisTextLayer();
        // 只要画板使用上传的 HT 字体，就不能再走 html2canvas 的普通 PNG 路径。
        // 从原有倍率菜单点击也会直接进入当前标签页捕获，避免用户误选旧回退导出。
        if (requiresNativeCapture) {
            exportNativeCapturePNG(scale);
            return;
        }
        const oldActive = [...activeLayerIds];
        const overlay = document.getElementById('export-overlay');
        const safeGuide = document.getElementById('safe-guide');
        const oldGuideDisplay = safeGuide ? safeGuide.style.display : '';
        activeLayerIds = [];
        renderCanvas(); renderLayersList(); renderProperties();
        if (safeGuide) safeGuide.style.display = 'none';
        await document.fonts.ready;
        overlay.style.display = 'flex';
        try {
            let blob;
            if (requiresNativeCapture) {
                try {
                    blob = await renderCurrentArtboardBlob(scale);
                } catch (rasterError) {
                    console.error('HT 高清文字合成失败：', rasterError);
                    // 不能丢弃底层原因；OTF 解析、路径转换和脚本加载的处理方式不同。
                    throw new Error('HT 字体路径转换失败：' + (rasterError?.message || '未知错误'));
                }
            } else {
                blob = await renderCurrentArtboardBlob(scale);
            }
            downloadBlob(blob, `GCC_${getArtboardPreset(currentArtboardId).label}_${Date.now()}.png`);
            const htModeLabel = { outline: '字体轮廓', 'native-image': '原生文字图片', 'legacy-fallback': '旧文字回退' };
            showToast('✅ ' + scale + '倍 PNG 导出成功' + (requiresNativeCapture ? '（HT：' + (htModeLabel[blob.vfHTExportMode] || '未识别') + '）' : ''));
        } catch (e) {
            console.error('PNG 导出失败:', e);
            showToast('❌ 导出失败：' + (e?.message || '未知错误'), true);
        } finally {
            overlay.style.display = 'none';
            if (safeGuide) safeGuide.style.display = oldGuideDisplay;
            syncSafeGuide();
            activeLayerIds = oldActive;
            renderCanvas(); renderLayersList(); renderProperties();
        }
    }
    async function exportAllArtboards(scale) {
        scale = scale || 2;
        saveCurrentArtboardState();
        const exportable = ARTBOARD_PRESETS.filter(p => (artboards[p.id]?.layers || []).length > 0);
        if(exportable.length === 0) return showToast('三个画布都是空的，无法导出', true);
        await document.fonts.ready;
        const originalArtboardId = currentArtboardId;
        const originalActive = [...activeLayerIds];
        const overlay = document.getElementById('export-overlay');
        overlay.style.display = 'flex';
        try {
            for(const preset of exportable) {
                loadArtboard(preset.id, false);
                activeLayerIds = [];
                renderCanvas(); renderLayersList(); renderProperties();
                const blob = await renderCurrentArtboardBlob(scale);
                downloadBlob(blob, `GCC_${preset.label}_${Date.now()}.png`);
                await new Promise(r => setTimeout(r, 180));
            }
            showToast(`✅ 已导出 ${exportable.length} 个画布`);
        } catch(e) {
            console.error('批量 PNG 导出失败:', e);
            showToast('❌ 批量导出失败：' + (e?.message || '未知错误'), true);
        } finally {
            loadArtboard(originalArtboardId, false);
            activeLayerIds = originalActive.filter(id => layers.some(l => l.id === id));
            renderCanvas(); renderLayersList(); renderProperties();
            overlay.style.display = 'none';
        }
    }

    async function bootApp() {
        await loadGlobalData();
        await loadFontsFromDB();
        await loadReferenceElementsFromDB();
        await loadSharedAssetsFromCloud();
        // 刷新后先清理上一会话移入回收站的云端资产；收到完成消息后再加载清单。
        if (!purgeRecycleBinAfterReload()) notifyParent({ type: 'vf:request-templates' });
        setupCanvasDropImport();
        setupLayerDropImport();
        setupLayerListResize();
        setupComponentDrop();
        setupAIReferenceDrop();
        renderCustomArtboardControls();
        syncRatioNav();
        resizeCanvas();
        renderCanvas();
        renderLayersList();
        renderProperties();
        renderAssetLibrary();
        renderPromptTags();
        refreshAIConsole();
        saveHistory();
    }
    function setupLayerListResize() {
        const list = document.getElementById('layer-list-ui');
        const handle = document.getElementById('layer-list-resize-handle');
        const card = document.getElementById('layer-module-card');
        if(!list || !handle || !card || handle.dataset.resizeReady) return;
        handle.dataset.resizeReady = 'true';
        const minHeight = 126;
        const maxHeight = 620;
        const storageKey = 'vf-static-layer-list-height';
        const clampHeight = value => Math.max(minHeight, Math.min(maxHeight, Math.round(value)));
        const applyHeight = value => { list.style.setProperty('--layer-list-height', clampHeight(value) + 'px'); };
        try {
            const saved = Number(localStorage.getItem(storageKey));
            if(saved) applyHeight(saved);
        } catch(_) {}
        let startY = 0;
        let startHeight = 0;
        const finishResize = () => {
            if(!card.classList.contains('resizing-layers')) return;
            card.classList.remove('resizing-layers');
            try { localStorage.setItem(storageKey, String(Math.round(list.getBoundingClientRect().height))); } catch(_) {}
        };
        handle.addEventListener('pointerdown', event => {
            event.preventDefault();
            startY = event.clientY;
            startHeight = list.getBoundingClientRect().height;
            card.classList.add('resizing-layers');
            handle.setPointerCapture?.(event.pointerId);
        });
        handle.addEventListener('pointermove', event => {
            if(!card.classList.contains('resizing-layers')) return;
            applyHeight(startHeight + event.clientY - startY);
        });
        handle.addEventListener('pointerup', finishResize);
        handle.addEventListener('pointercancel', finishResize);
        handle.addEventListener('keydown', event => {
            if(event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
            event.preventDefault();
            const delta = event.key === 'ArrowUp' ? -24 : 24;
            applyHeight(list.getBoundingClientRect().height + delta);
            try { localStorage.setItem(storageKey, String(Math.round(list.getBoundingClientRect().height + delta))); } catch(_) {}
        });
    }
    document.addEventListener('click', e => { if(!e.target.closest('.ai-menu-wrap')) closeAIMenus(); });
    bootApp();

</script>
