name: Deploy v868 to test branch

on:
  push:
    branches: [tmp-deploy-v868]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: npm run build:pages

      - name: Deploy to Cloudflare Pages (test branch)
        run: npx --yes wrangler@4.60.0 pages deploy dist --project-name visual-factory --branch asset-gallery-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
