name: Deploy v871 to test branch

on:
  push:
    branches: [tmp-deploy-v871]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy v960 upload fix to Cloudflare Pages production
        run: npx --yes wrangler@4.60.0 pages deploy dist --project-name visual-factory --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
