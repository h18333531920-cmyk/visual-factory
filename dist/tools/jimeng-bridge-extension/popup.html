<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 330px; margin: 0; padding: 18px; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17191d; }
    h1 { font-size: 17px; margin: 0 0 9px; }
    .hint { color: #68707b; line-height: 1.55; }
    .tab { width: 100%; margin: 12px 0 0; padding: 12px; border: 1px solid #1f2937; border-radius: 11px; background: #111827; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .tab:hover { background: #202a3a; }
    .tab:disabled { cursor: wait; opacity: .72; }
    .tab.is-paired { box-shadow: 0 0 0 2px rgba(17, 24, 39, .12); }
    .secondary { width: 100%; margin-top: 10px; padding: 8px; border: 0; background: transparent; color: #64748b; font: inherit; cursor: pointer; }
    .secondary:hover { color: #111827; }
    .empty { padding: 16px 0 4px; color: #8a929d; line-height: 1.5; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <h1>GCC Design · 即梦本机桥</h1>
  <div class="hint">当前连接只保留一个标签页。需要更换时再选择其他已登录的即梦页面。</div>
  <div id="tabs" class="empty">正在查找即梦标签页…</div>
  <button id="switch-tab" class="secondary" type="button" hidden></button>
  <script src="popup.js"></script>
</body>
</html>
